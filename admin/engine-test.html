<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SureSlip - Poisson Engine Pro Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .test {
            padding: 12px;
            margin: 8px 0;
            border-radius: 7px;
        }

        .pass {
            background: #ecfdf5;
            border-left: 5px solid #16a34a;
        }

        .fail {
            background: #fef2f2;
            border-left: 5px solid #dc2626;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
        }

        .market {
            font-size: 21px;
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #111827;
            color: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>SureSlip Engine Pro</h1>

        <p>
            Production Poisson + Dixon-Coles Engine Test
        </p>

        <button onclick="runRealEngineTest()">
            🧪 RUN REAL ENGINE TEST
        </button>

    </div>

    <div
        id="status"
        class="card"
        style="display:none;"
    ></div>

    <div
        id="prediction"
        class="card"
        style="display:none;"
    ></div>

    <div
        id="details"
        class="card"
        style="display:none;"
    ></div>

</div>


<!-- LOAD THE ACTUAL PRODUCTION ENGINE -->

<script src="../poisson-engine-pro.js"></script>


<script>

function percentage(probability) {

    return (
        Number(probability) * 100
    ).toFixed(2) + "%";

}


function test(name, condition) {

    return {
        name,
        pass: Boolean(condition)
    };

}


function runRealEngineTest() {

    const status =
        document.getElementById("status");

    const prediction =
        document.getElementById("prediction");

    const details =
        document.getElementById("details");


    status.style.display = "block";
    prediction.style.display = "none";
    details.style.display = "none";


    const tests = [];


    /*
     * =====================================
     * ENGINE EXISTENCE
     * =====================================
     */

    tests.push(
        test(
            "Poisson Engine Pro loaded",
            typeof window.DixonColesEnginePro === "function"
        )
    );


    /*
     * =====================================
     * RUN REAL ENGINE
     * =====================================
     */

    let result = null;
    let engineError = null;


    try {

        result =
            window.DixonColesEnginePro.predict(
                1.85,
                1.05,
                -0.13,
                8
            );

    } catch (error) {

        engineError =
            error;

    }


    tests.push(
        test(
            "Engine prediction executed",
            result !== null
        )
    );


    if (engineError) {

        status.innerHTML = `

            <h2>❌ ENGINE ERROR</h2>

            <pre>${escapeHtml(
                engineError.stack ||
                engineError.message
            )}</pre>

        `;

        return;
    }


    /*
     * =====================================
     * EXACT SCORE
     * =====================================
     */

    tests.push(
        test(
            "Top exact scores returned",
            Array.isArray(
                result.topCorrectScores
            ) &&
            result.topCorrectScores.length > 0
        )
    );


    /*
     * We only want ONE top score
     */

    const topScore =
        result.topCorrectScores &&
        result.topCorrectScores.length
            ? result.topCorrectScores[0]
            : null;


    tests.push(
        test(
            "Top exact score exists",
            !!topScore &&
            typeof topScore.score === "string"
        )
    );


    tests.push(
        test(
            "Top exact score probability valid",
            !!topScore &&
            topScore.prob > 0 &&
            topScore.prob <= 1
        )
    );


    /*
     * =====================================
     * 1X2
     * =====================================
     */

    const homeWin =
        result.main1X2.homeWin.prob;

    const draw =
        result.main1X2.draw.prob;

    const awayWin =
        result.main1X2.awayWin.prob;


    const oneXTwoTotal =
        homeWin +
        draw +
        awayWin;


    tests.push(
        test(
            "1X2 probabilities valid",
            Math.abs(
                oneXTwoTotal - 1
            ) < 0.001
        )
    );


    /*
     * =====================================
     * BTTS
     * =====================================
     */

    const bttsYes =
        result.btts.yes.prob;

    const bttsNo =
        result.btts.no.prob;


    tests.push(
        test(
            "BTTS probabilities valid",
            Math.abs(
                bttsYes +
                bttsNo -
                1
            ) < 0.001
        )
    );


    /*
     * =====================================
     * GOALS
     * =====================================
     */

    tests.push(
        test(
            "Over 1.5 available",
            typeof result.goalsOverUnder.over15.prob
                === "number"
        )
    );


    tests.push(
        test(
            "Over 2.5 available",
            typeof result.goalsOverUnder.over25.prob
                === "number"
        )
    );


    /*
     * =====================================
     * DIXON-COLES
     * =====================================
     */

    tests.push(
        test(
            "Dixon-Coles rho applied",
            result.inputs &&
            result.inputs.rho === -0.13
        )
    );


    /*
     * =====================================
     * EXPECTED GOALS
     * =====================================
     */

    tests.push(
        test(
            "Home expected goals correct",
            result.inputs &&
            result.inputs.expectedGoalsHome === 1.85
        )
    );


    tests.push(
        test(
            "Away expected goals correct",
            result.inputs &&
            result.inputs.expectedGoalsAway === 1.05
        )
    );


    /*
     * =====================================
     * ODDS
     * =====================================
     */

    tests.push(
        test(
            "Exact score fair odds available",
            !!topScore &&
            typeof topScore.odds === "number"
        )
    );


    /*
     * =====================================
     * DISPLAY TESTS
     * =====================================
     */

    let allPassed = true;

    let html = "";


    tests.forEach(item => {

        if (!item.pass) {
            allPassed = false;
        }

        html += `

            <div class="test ${
                item.pass
                    ? "pass"
                    : "fail"
            }">

                ${
                    item.pass
                        ? "✅"
                        : "❌"
                }

                ${escapeHtml(item.name)}

            </div>

        `;

    });


    status.innerHTML = `

        <h2>
            ${
                allPassed
                    ? "✅ ALL ENGINE TESTS PASSED"
                    : "❌ SOME TESTS FAILED"
            }
        </h2>

        ${html}

    `;


    /*
     * =====================================
     * PREDICTION DISPLAY
     * =====================================
     */

    prediction.style.display =
        "block";


    prediction.innerHTML = `

        <h2>
            Sample Production Prediction
        </h2>

        <p>
            Expected Goals:
            <strong>
                ${result.inputs.expectedGoalsHome}
                -
                ${result.inputs.expectedGoalsAway}
            </strong>
        </p>

        <hr>

        <p>
            🎯 TOP EXACT SCORE
        </p>

        <div class="score">
            ${escapeHtml(topScore.score)}
        </div>

        <p>
            Probability:
            <strong>
                ${percentage(topScore.prob)}
            </strong>
        </p>

        <p>
            Fair Odds:
            <strong>
                ${topScore.odds}
            </strong>
        </p>

        <hr>

        <h3>1X2</h3>

        <p>
            Home:
            <strong>
                ${percentage(homeWin)}
            </strong>
        </p>

        <p>
            Draw:
            <strong>
                ${percentage(draw)}
            </strong>
        </p>

        <p>
            Away:
            <strong>
                ${percentage(awayWin)}
            </strong>
        </p>

        <hr>

        <h3>BTTS</h3>

        <p>
            Yes:
            <strong>
                ${percentage(bttsYes)}
            </strong>
        </p>

        <p>
            No:
            <strong>
                ${percentage(bttsNo)}
            </strong>
        </p>

        <hr>

        <h3>Goals</h3>

        <p>
            Over 1.5:
            <strong>
                ${
                    percentage(
                        result.goalsOverUnder.over15.prob
                    )
                }
            </strong>
        </p>

        <p>
            Over 2.5:
            <strong>
                ${
                    percentage(
                        result.goalsOverUnder.over25.prob
                    )
                }
            </strong>
        </p>

    `;


    /*
     * =====================================
     * RAW ENGINE OUTPUT
     * =====================================
     */

    details.style.display =
        "block";


    details.innerHTML = `

        <h2>
            Production Engine Output
        </h2>

        <pre>${escapeHtml(
            JSON.stringify(
                result,
                null,
                2
            )
        )}</pre>

    `;

}


/*
 * Prevent HTML injection when displaying
 * engine output in the browser.
 */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
